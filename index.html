<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>The Fein Heit Boutique &amp; Parlour</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background: #171514;
    }

    /* ==================== SITE FRAME (loads instantly underneath) ==================== */
    .website-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #fdfbf7;
    }

    /* ==================== SPLASH / PREVIEW OVERLAY ==================== */
    .splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 50% 40%, rgba(197, 155, 125, 0.16), transparent 60%),
        linear-gradient(160deg, #171514 0%, #201b18 55%, #12100f 100%);
      overflow: hidden;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }

    .splash-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Soft ambient glow orbs for depth */
    .splash-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.20), transparent 70%);
      filter: blur(10px);
      animation: floatGlow 6s ease-in-out infinite;
      pointer-events: none;
    }
    .splash-glow.g1 { top: -10%; left: -10%; animation-delay: 0s; }
    .splash-glow.g2 { bottom: -15%; right: -10%; animation-delay: 1.5s; }

    @keyframes floatGlow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.08); }
    }

    /* Emblem ring that draws itself in */
    .splash-ring {
      position: relative;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.72);
      animation: ringIn 1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      z-index: 2;
    }

    .splash-ring::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(197, 155, 125, 0.35);
      animation: ringSpin 8s linear infinite;
    }

    .splash-ring::after {
      content: '';
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 1.5px dashed rgba(212, 175, 55, 0.28);
      animation: ringSpin 14s linear infinite reverse;
    }

    @keyframes ringIn {
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes ringSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .splash-logo-img {
      width: 148px;
      height: 148px;
      object-fit: cover;
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgba(197, 155, 125, 0.4), 0 12px 34px rgba(0, 0, 0, 0.45);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .splash-brand {
      margin-top: 2.3rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 3rem;
      letter-spacing: 0.2em;
      color: #f5efe6;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
      text-align: center;
      z-index: 2;
      padding: 0 1.5rem;
    }

    .splash-tagline {
      margin-top: 0.85rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 0.92rem;
      letter-spacing: 0.4em;
      color: #c59b7d;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      z-index: 2;
    }

    /* Gold shimmer loading bar */
    .splash-loader {
      margin-top: 3rem;
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.6s ease 1.05s forwards;
      z-index: 2;
    }

    .splash-loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #d4af37, #dfc2ad, #d4af37, transparent);
      animation: loaderSweep 1.3s ease-in-out infinite;
    }

    @keyframes loaderSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(360%); }
    }

    /* Respect users who prefer reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .splash-ring, .splash-brand, .splash-tagline, .splash-loader, .splash-glow, .splash-loader-bar {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }

    /* Scale the emblem/text down a touch on narrow phones so it still
       breathes without overflowing the viewport. */
    @media (max-width: 420px) {
      .splash-ring {
        width: 170px;
        height: 170px;
      }
      .splash-logo-img {
        width: 116px;
        height: 116px;
      }
      .splash-brand {
        font-size: 2.15rem;
        letter-spacing: 0.14em;
      }
      .splash-tagline {
        font-size: 0.78rem;
        letter-spacing: 0.3em;
      }
      .splash-loader {
        width: 160px;
      }
    }
  </style>
</head>
<body>

  <iframe class="website-frame" src="home.html" title="The Fein Heit website"></iframe>

  <div class="splash-overlay" id="splashOverlay">
    <div class="splash-glow g1"></div>
    <div class="splash-glow g2"></div>

    <div class="splash-ring">
      <img class="splash-logo-img" src="images/emblem_only.png" alt="The Fein Heit emblem" />
    </div>

    <div class="splash-brand">The Fein Heit</div>
    <div class="splash-tagline">Boutique &amp; Parlour</div>

    <div class="splash-loader"><div class="splash-loader-bar"></div></div>
  </div>

  <script>
    // Auto-dismiss the animated preview on every device after it has had
    // time to play, then let the live site underneath take over.
    var splash = document.getElementById('splashOverlay');
    var MIN_DISPLAY_MS = 2500;

    function dismissSplash() {
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () {
        if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
      }, 850);
    }

    setTimeout(dismissSplash, MIN_DISPLAY_MS);

    // Allow an impatient visitor to tap/click through immediately.
    if (splash) {
      splash.addEventListener('click', dismissSplash);
    }
  </script>
</body>
</html>
