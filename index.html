<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Fein Heit</title>
  <style>
    html,
    body {
      width: 100%;
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000;
    }

    .brand-image {
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* use the real, dynamic viewport height on mobile browsers */
      object-fit: cover;
      object-position: center;
    }

    .website-frame {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      border: 0;
      background: #fdfbf7;
    }

    /* On phones, skip the full-screen splash image so visitors land
       straight on the live site instead of scrolling past a static banner. */
    @media (max-width: 768px) {
      .brand-image {
        display: none;
      }
    }
  </style>
</head>
<body>
  <img class="brand-image" src="images/Gemini_Generated_Image_oi3enjoi3enjoi3e.png" alt="The Fein Heit brand" />
  <iframe class="website-frame" src="home.html" title="The Fein Heit website"></iframe>
</body>
</html>
